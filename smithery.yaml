# Smithery.ai MCP Registry configuration
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Optional Agent Kiosk API key (ak_live_...) for unlimited calls. Leave empty for 2 free calls/day, or get a pass at https://agent-kiosk.vercel.app/buy"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: config.apiKey ? { AGENT_KIOSK_API_KEY: config.apiKey } : {}
    })
