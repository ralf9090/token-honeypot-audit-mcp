# Smithery.ai MCP Registry configuration
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Optional ak_live_... API key for unlimited calls (2 free calls/day included automatically)"
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: {
        AGENT_KIOSK_API_KEY: config.apiKey || ''
      }
    })
